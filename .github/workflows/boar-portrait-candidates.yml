name: Generate boar portrait candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/build_boar_portraits.py'
      - 'tools/boar-display-ids.json'
      - '.github/workflows/boar-portrait-candidates.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image libraries
        run: python -m pip install Pillow requests
      - name: Download creature thumbnails and render candidate head crops
        run: python tools/build_boar_portraits.py --install
      - name: Publish validated portrait assets to the addon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Textures/Portrait_*.tga docs/BoarPortraits-ContactSheet.png
          if ! git diff --cached --quiet; then
            git commit -m "Add 21 distinct boar display portraits [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload original model images, review sheet and TGA candidates
        uses: actions/upload-artifact@v4
        with:
          name: boar-portrait-candidates
          path: tools/portrait-candidates/
          if-no-files-found: error
